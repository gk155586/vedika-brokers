<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Vedika Brokers</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = window.location.pathname.startsWith('/vedika-brokers') ? 1 : 0;
      var l = window.location;
      var cleanBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        cleanBase + '/?/' + route +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <div style="width: 48px; height: 48px; border: 4px solid #f59e0b; border-top-color: transparent; border-radius: 50%; margin: 0 auto 16px auto; animation: spin 1s linear infinite;"></div>
      <p style="font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: #94a3b8;">Loading Vedika Brokers...</p>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
